name: Nightly

on:
  workflow_run:
    workflows: ["Build AAR"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: zstd-jni
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/

      - name: remove Nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo set-default ${{ github.repository }}
          gh release delete nightly --cleanup-tag -y || true
          git push origin --delete nightly || true

      - name: upload Nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create nightly target/*.aar \
            --title "Nightly Build ($(date -u +'%Y-%m-%d'))" \
            --notes "Automated nightly sync and build from upstream luben/zstd-jni." \
            --prerelease