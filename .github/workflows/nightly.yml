name: Nightly

on:
  workflow_run:
    workflows: ["Build AAR"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: zstd-jni
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/

      - name: Check Nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo set-default ${{ github.repository }}
          
          if gh release view nightly &>/dev/null; then
            echo "Nightly release found. Deleting..."
            gh release delete nightly --cleanup-tag -y
          else
            echo "No existing nightly release found. Skipping deletion."
          fi

          git push origin --delete nightly || true

      - name: upload Nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create nightly target/*.aar \
            --title "Nightly Build ($(date -u +'%Y-%m-%d'))" \
            --notes "Automated nightly sync and build from upstream luben/zstd-jni." \
            --prerelease